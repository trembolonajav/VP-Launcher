<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
:root{color-scheme:dark}body{width:340px;margin:0;padding:15px;background:#08111f;color:#edf4ff;font:13px system-ui,sans-serif}h1{font-size:17px;margin:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.dot{width:9px;height:9px;border-radius:50%;background:#596579;display:inline-block;margin-right:6px}.dot.on{background:#3ad67d;box-shadow:0 0 8px #3ad67d}.card{background:#101c2e;border:1px solid #24344e;border-radius:9px;padding:11px;margin:8px 0}.row{display:flex;justify-content:space-between;gap:12px;margin:5px 0}.label{color:#98a9c2}.value{text-align:right;font-weight:700}.bar{height:6px;background:#26354a;border-radius:5px;overflow:hidden;margin-top:6px}.fill{height:100%;background:#3a8cff;width:0}.modes,.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.mode,button{border:0;border-radius:7px;padding:9px;color:#fff;background:#273750;font-weight:700;cursor:pointer}.mode.active{background:#287cff}.actions{margin-top:9px}button.secondary{background:#41516b}#status{min-height:18px;color:#8de8ae;margin-top:9px}.muted{color:#8091aa;font-size:11px;line-height:1.35}
</style></head><body>
<div class="top"><h1>VP Client</h1><span><i id="dot" class="dot"></i><span id="connection">Conectando</span></span></div>
<div class="card"><div class="row"><span class="label">Personagem</span><span id="player" class="value">—</span></div><div class="row"><span class="label">Local</span><span id="location" class="value">—</span></div><div class="row"><span class="label">Última hunt</span><span id="last-hunt" class="value">—</span></div></div>
<div class="card"><div class="row"><span class="label">Pokémon ativo</span><span id="pokemon" class="value">—</span></div><div class="row"><span class="label">HP</span><span id="hp" class="value">—</span></div><div class="bar"><div id="hp-fill" class="fill"></div></div><div class="row"><span class="label">Coleção</span><span id="capacity" class="value">—</span></div><div class="bar"><div id="capacity-fill" class="fill"></div></div></div>
<div class="card"><div class="row"><span class="label">Estado</span><span id="activity" class="value">—</span></div><div class="row"><span class="label">Atualização</span><span id="updated" class="value">—</span></div></div>
<div class="modes"><button id="mode-monitor" class="mode">Monitorar</button><button id="mode-assisted" class="mode">Assistido</button></div><p class="muted">Monitorar apenas observa. O modo Assistido será usado para etapas guiadas e continuará exigindo confirmação para vendas.</p>
<div id="assist-actions" class="card" hidden><button id="full-cycle" style="width:100%;background:#287cff">Executar ciclo assistido</button><div class="actions" style="margin-top:7px"><button id="prepare-sale">Preparar venda</button><button id="confirm-sale" class="secondary" disabled>Confirmar venda</button></div><button id="return-hunt" class="secondary" style="width:100%;margin-top:7px">Retornar à última hunt</button><div id="sale-preview" class="muted" style="margin-top:8px">Nenhuma venda preparada.</div></div>
<div class="actions"><button id="refresh">Atualizar</button><button id="capture" class="secondary">Salvar diagnóstico</button></div><div id="status"></div><script src="popup.js"></script></body></html>
